title: 相關報導｜23.5° 剛剛好的城市
desc: 媒體、公民新聞與在地團隊對嘉義水上鄉仙草產業、地方創生與觀光的報導整理。
---
  <section class="sec sec-sand">
    <div class="wrap">
      <div class="sec-head rise">
        <p class="en">IN THE NEWS</p>
        <h2>相關報導與資源</h2>
        <p>以下皆為外部連結，點擊會在新分頁開啟原文。標籤標示了來源性質——
          新聞媒體、公民新聞、官方資料庫，或是旅遊部落格與品牌專文。</p>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <div class="news">
{{news}}
      </div>
      <div class="sticker rise" style="margin-top:2rem; padding:1.4rem 1.5rem">
        <p style="font-size:var(--fs-sm); color:var(--ink-2)">
          <b style="color:var(--ink)">想補上你的報導？</b><br>
          這一頁的資料維護在 <code>assets/</code> 之外、直接寫在 <code>news.html</code> 裡；
          若之後改成後台管理，這裡會換成從資料來源動態產生。有遺漏或想新增的媒體露出，
          歡迎透過<a href="contact.html">聯絡我們</a>告訴我們。</p>
      </div>
    </div>
  </section>
